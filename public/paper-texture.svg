<svg
  xmlns="http://www.w3.org/2000/svg"
  width="420"
  height="420"
  viewBox="0 0 420 420"
>
  <filter id="paperNoise">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.75"
      numOctaves="5"
      seed="17"
      stitchTiles="stitch"
    />

    <feColorMatrix
      type="saturate"
      values="0"
    />

    <feComponentTransfer>
      <feFuncR
        type="table"
        tableValues="0.25 0.75"
      />
      <feFuncG
        type="table"
        tableValues="0.25 0.75"
      />
      <feFuncB
        type="table"
        tableValues="0.20 0.70"
      />
      <feFuncA
        type="table"
        tableValues="0 0.35"
      />
    </feComponentTransfer>
  </filter>

  <rect
    width="420"
    height="420"
    filter="url(#paperNoise)"
  />
</svg>